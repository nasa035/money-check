# Copy this file into the money-check repository as .github/workflows/pages.yml
# It publishes the newest money-check-site*.zip and builds users.json from the users/ folder.
name: Publish check site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          zip=$(ls money-check-site*.zip | sort | tail -n 1)
          unzip -o -j "$zip" -d _site
          node -e '
            const fs=require("fs"), dir="users", out=[];
            if (fs.existsSync(dir)) for (const f of fs.readdirSync(dir).sort()) {
              if (!f.endsWith(".json")) continue;
              try { const u=JSON.parse(fs.readFileSync(dir+"/"+f,"utf8"));
                if (u && u.name && /^[2-9A-HJ-NP-Z]{4}-[2-9A-HJ-NP-Z]{4}$/.test(u.id) && typeof u.key==="string")
                  out.push({name:u.name, id:u.id, key:u.key, added:u.added||"", file:f});
              } catch (e) { console.log("skipped " + f); }
            }
            fs.writeFileSync("_site/users.json", JSON.stringify(out));
            console.log(out.length + " approved users");'
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
